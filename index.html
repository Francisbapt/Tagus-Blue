<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagus Blue</title>
  <style>
    body { font-family: sans-serif; background: #f4f7f9; color: #333; padding: 30px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; text-align: center; }
    h1 { color: #0066cc; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; text-align: left; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .badge { display: inline-block; background: #e1f0ff; color: #0066cc; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; margin: 2px; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Tagus Blue</h1>
    <p>Detalhes do Serviço e Configurações de Reserva</p>
    <div id="app" class="grid">
      <div class="card"><p>A carregar dados...</p></div>
    </div>
  </div>

  <script>
    const app = document.getElementById('app');

    // Tenta carregar o ficheiro JSON
    fetch('./Tagusbluesup_site.json')
      .then(res => {
        if (!res.ok) throw new Error('Ficheiro JSON não encontrado (Erro ' + res.status + ')');
        return res.json();
      })
      .then(data => {
        app.innerHTML = ''; // Limpa a mensagem

        // Cartão Pagamento
        if (data.payment) {
          const methods = (data.payment.payment_methods || []).map(m => `<span class="badge">${m}</span>`).join(' ');
          app.innerHTML += `
            <div class="card">
              <h3>💳 Pagamento</h3>
              <p><strong>Moeda:</strong> ${data.payment.currency || 'EUR'}</p>
              <p><strong>Provedor:</strong> ${data.payment.provider || 'N/A'}</p>
              <p><strong>Métodos:</strong><br>${methods}</p>
            </div>`;
        }

        // Cartão Confirmação
        if (data.confirmation) {
          const items = (data.confirmation.include || []).map(i => `<li>${i}</li>`).join('');
          app.innerHTML += `
            <div class="card">
              <h3>📋 Confirmação</h3>
              <ul>${items}</ul>
            </div>`;
        }

        // Cartão Calendário
        if (data.calendar) {
          const views = (data.calendar.views || []).map(v => `<span class="badge">${v}</span>`).join(' ');
          app.innerHTML += `
            <div class="card">
              <h3>📅 Calendário</h3>
              <p><strong>Dashboard:</strong> ${data.calendar.admin_dashboard ? 'Ativo' : 'Inativo'}</p>
              <p><strong>Vistas:</strong><br>${views}</p>
            </div>`;
        }
      })
      .catch(err => {
        app.innerHTML = `<div class="card" style="border: 2px solid red;"><p style="color:red; font-weight:bold;">${err.message}</p><p>Verifica se o ficheiro se chama exatamente <code>Tagusbluesup_site.json</code> no teu repositório.</p></div>`;
      });
  </script>

</body>
</html>
